[package]
name = "pterm"
version = "0.1.0"
description = "跨平台 SSH 终端客户端"
authors = ["pterm"]
edition = "2021"
# tauri-plugin-updater 的较新版本要求 Rust >= 1.90
rust-version = "1.90"

[lib]
name = "pterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
# 自动更新（FEATURES.md §6）：从 GitHub Releases 的 latest.json 检查并安装更新
tauri-plugin-updater = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# SSH 核心
ssh2 = { version = "0.9", features = ["vendored-openssl"] }

# 可选模块
git2 = { version = "0.19", features = ["vendored-libgit2", "vendored-openssl"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "charset", "http2"] }

# 本地存储
rusqlite = { version = "0.32", features = ["bundled"] }

# 保险库加密（主密码 Argon2id 派生 + AES-256-GCM）
argon2 = "0.5"
aes-gcm = "0.10"
getrandom = "0.2"

# 运行时
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = "0.3"

base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
dirs = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# dev 构建不产完整调试信息，避免 target/debug 膨胀到十几 G。
# 自己的代码只保留行号（panic 回溯仍能给出 file:line，够排障用），
# 依赖（含 vendored openssl / libgit2 / sqlite）一律不产调试信息。
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false

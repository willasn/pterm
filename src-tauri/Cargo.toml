[package]
name = "pterm"
version = "0.3.0"
description = "跨平台 SSH 终端客户端"
authors = ["pterm"]
edition = "2021"
# tauri-plugin-updater 的较新版本要求 Rust >= 1.90
rust-version = "1.90"

[lib]
name = "pterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# 自动更新（FEATURES.md §6）：从 GitHub Releases 的 latest.json 检查并安装更新
tauri-plugin-updater = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# 更新源版本号比较（取多个更新源中最大的有效版本）
semver = "1"

# SSH 核心
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
# 本地终端：跨平台 PTY（Unix pty / Windows ConPTY）
portable-pty = "0.8"

# 可选模块
git2 = { version = "0.19", features = ["vendored-libgit2", "vendored-openssl"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "charset", "http2"] }

# 本地存储
rusqlite = { version = "0.32", features = ["bundled"] }

# 主机密钥指纹（known_hosts，OpenSSH 风格 SHA256 指纹）
sha2 = "0.10"

# 一键生成 SSH 密钥对：纯 Rust 生成 ed25519（不依赖系统 ssh-keygen）
ssh-key = { version = "0.6", features = ["ed25519"] }
rand = "0.8"

# 保险库加密（主密码 Argon2id 派生 + AES-256-GCM）
argon2 = "0.5"
aes-gcm = "0.10"
getrandom = "0.2"

# 激活码授权：Zely 客户端 SDK（在线激活 + 离线凭证验签）
# 按 tag 锁定版本，升级时改这里并跑一次构建，不要跟分支
zely-license = { git = "https://github.com/willasn/zely-issuance", tag = "v0.2.2" }

# 运行时
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
futures-util = "0.3"

# MCP 服务（可开关）：本地 127.0.0.1 上的 Streamable HTTP 端点，供外部 AI 调用
axum = "0.8"

# 系统剪贴板：macOS 的 WKWebView 在自定义协议下不提供 navigator.clipboard，
# 复制 / 粘贴统一由 Rust 侧读写系统剪贴板兜底（只用到纯文本，不启用图片支持）
arboard = { version = "3.6", default-features = false }

base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
dirs = "5"
tauri-plugin-single-instance = "2.5.3"
drag = "2"

# 系统托盘（仅 Windows）：托盘图标 / 右键菜单依赖 tauri 的 tray-icon feature。
# macOS 不支持系统托盘，通用依赖里不开启该 feature，避免无用编译。
[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# dev 构建不产完整调试信息，避免 target/debug 膨胀到十几 G。
# 自己的代码只保留行号（panic 回溯仍能给出 file:line，够排障用），
# 依赖（含 vendored openssl / libgit2 / sqlite）一律不产调试信息。
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false

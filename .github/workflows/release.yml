name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Sync version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Syncing version -> $VERSION"
          node -e '
            const fs = require("fs");
            const v = process.argv[1];
            const conf = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            conf.version = v;
            fs.writeFileSync("src-tauri/tauri.conf.json", JSON.stringify(conf, null, 2) + "\n");
            let cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
            cargo = cargo.replace(/^version = ".*"$/m, `version = "${v}"`);
            fs.writeFileSync("src-tauri/Cargo.toml", cargo);
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = v;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          ' "$VERSION"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'pterm ${{ github.ref_name }}'
          releaseBody: |
            下载下方对应平台的安装包：

            - macOS (Apple Silicon)：`pterm_*.dmg`
            - Windows：`pterm_*.msi` 或 `pterm_*-setup.exe`

            > 未做代码签名：macOS 首次打开请右键「打开」放行；Windows 若出现 SmartScreen 提示请选择「仍要运行」。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

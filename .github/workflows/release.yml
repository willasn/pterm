name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Sync version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Syncing version -> $VERSION"
          # tauri.conf.json 的 version 已指向 package.json，无需在此改写。
          node -e '
            const fs = require("fs");
            const v = process.argv[1];
            let cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
            cargo = cargo.replace(/^version = ".*"$/m, `version = "${v}"`);
            fs.writeFileSync("src-tauri/Cargo.toml", cargo);
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = v;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          ' "$VERSION"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 自动更新签名：私钥（+ 可选密码）存在仓库 Secrets 里，
          # 公钥已写入 src-tauri/tauri.conf.json 的 plugins.updater.pubkey。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'pterm ${{ github.ref_name }}'
          releaseBody: |
            下载下方对应平台的安装包：

            - macOS (Apple Silicon)：`pterm_*.dmg`
            - Windows：`pterm_*.msi` 或 `pterm_*-setup.exe`

            > 安装包未做代码签名，首次打开可能被系统拦截，请按以下方式放行：

            **macOS**：若提示「无法验证开发者」，请右键点击应用 → 选择「打开」，或执行：

            ```
            xattr -cr /Applications/pterm.app
            ```

            **Windows**：若弹出 SmartScreen 提示，请点「更多信息」→「仍要运行」。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # 构建完成后把安装包同步到 Cloudflare R2（公共只读分发的镜像）。
  # 认证信息全部来自 GitHub Secrets，不落仓库；推送动作由 GitHub 托管的 runner 完成。
  publish-r2:
    needs: build
    runs-on: ubuntu-latest
    # R2 的 4 个 Secrets 建在该 Environment 下，job 必须声明它才能读到。
    environment: r2-publish
    permissions:
      contents: read
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir dist

      - name: Check R2 secrets
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          missing=""
          for name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::缺少仓库 Secrets:$missing"
            exit 1
          fi
          echo "R2 secrets 已配置"

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE: https://dl.pterm.panpan.space
        run: |
          set -euo pipefail

          # 1. 把 latest.json 里的下载地址从 GitHub Release 改写到 R2。
          #    不改的话客户端读到的 url 仍指向 GitHub，R2 就白传了。
          #    signature 是对文件内容签名的，与 url 无关，改写不会破坏更新校验。
          if [ -f dist/latest.json ]; then
            gh_prefix="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/"
            jq --arg p "$gh_prefix" --arg b "${R2_BASE}/latest/" \
              '.platforms |= with_entries(
                 .value.url |= (if startswith($p) then $b + .[($p | length):] else . end)
               )' dist/latest.json > dist/latest.json.tmp
            mv dist/latest.json.tmp dist/latest.json
            cat dist/latest.json
          fi

          # 2. 上传安装包。文件名自带版本号，内容不会变，可以长缓存。
          for f in dist/*; do
            name="$(basename "$f")"
            [ "$name" = "latest.json" ] && continue
            echo "上传 latest/$name"
            aws s3 cp "$f" "s3://$BUCKET/latest/$name" \
              --endpoint-url "$R2_ENDPOINT" \
              --cache-control "public, max-age=31536000, immutable"
          done

          # 3. 删除 latest/ 下不属于本次发布的旧文件（先传后删，避免 404 窗口）。
          existing="$(aws s3api list-objects-v2 \
            --bucket "$BUCKET" \
            --prefix "latest/" \
            --query 'Contents[].Key' \
            --output text \
            --endpoint-url "$R2_ENDPOINT")"
          [ "$existing" = "None" ] && existing=""
          for key in $existing; do
            name="$(basename "$key")"
            [ -f "dist/$name" ] && continue
            echo "删除旧文件 $key"
            aws s3 rm "s3://$BUCKET/$key" --endpoint-url "$R2_ENDPOINT"
          done

          # 4. 最后更新指针，保证 latest.json 生效时文件一定已就位。
          if [ -f dist/latest.json ]; then
            aws s3 cp dist/latest.json "s3://$BUCKET/latest.json" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type "application/json" \
              --cache-control "no-cache"
          else
            echo "latest.json 不存在，跳过指针更新"
          fi

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pshell</title>
  <link rel="stylesheet" href="vendor/xterm.css" />
  <link rel="stylesheet" href="styles/theme.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/terminal.css" />
  <link rel="stylesheet" href="styles/settings.css" />
</head>
<body data-theme="dark">
  <div class="app" id="app">
    <!-- 侧栏：连接列表。SSH 核心，始终可用 -->
    <aside class="sidebar" id="sidebar">
      <header class="sidebar-head">
        <button id="search-status" class="icon-btn" title="全局搜索" data-i18n-title="common.search" hidden>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
          </svg>
        </button>
        <div class="sidebar-head-actions">
          <button id="btn-new-conn" class="icon-btn" title="新建连接" data-i18n-title="common.new">＋</button>
          <button id="btn-settings" class="icon-btn" title="设置" data-i18n-title="common.settings">⚙</button>
          <button id="btn-sidebar-toggle" class="icon-btn" title="收起侧边栏" data-i18n-title="common.sidebarCollapse">«</button>
        </div>
      </header>
      <div class="quick-connect" id="quick-connect" hidden>
        <input id="quick-input" type="text" placeholder="user@host:port  回车直达" spellcheck="false" />
      </div>
      <nav id="conn-list" class="conn-list"></nav>
      <footer class="sidebar-foot">
        <button id="git-status" class="git-status" title="Git 同步" data-i18n-title="common.gitSync" hidden></button>
        <button id="log-status" class="git-status" title="会话日志" data-i18n-title="common.sessionLog" hidden></button>
        <button id="sftp-status" class="git-status" title="SFTP 文件" data-i18n-title="common.sftp" hidden></button>
        <button id="pf-status" class="git-status" title="端口转发" data-i18n-title="common.portForward" hidden></button>
        <button id="ie-status" class="git-status" title="配置导入导出" data-i18n-title="common.importExport" hidden></button>
        <button id="snip-status" class="git-status" title="命令片段" data-i18n-title="common.snippets" hidden></button>
        <button id="hist-status" class="git-status" title="命令历史" data-i18n-title="common.history" hidden></button>
        <span id="app-version" class="muted"></span>
        <span id="module-summary" class="muted"></span>
      </footer>
      <!-- 右缘拖拽条：左右拖动调整侧栏宽度 -->
      <div class="sidebar-resizer" id="sidebar-resizer" title="拖动调整宽度" data-i18n-title="common.sidebarResize"></div>
    </aside>

    <!-- 主区：左侧终端栈 + 右侧 AI 停靠面板 -->
    <main class="main">
      <div class="main-stack" id="main-stack">
        <!-- 侧栏收起后主区左上角的展开入口 -->
        <button id="btn-sidebar-show" class="icon-btn sidebar-show" title="展开侧边栏" data-i18n-title="common.sidebarExpand" hidden>»</button>
        <div class="tabbar" id="tabbar" hidden>
          <div class="tab-list" id="tab-list"></div>
          <button class="tab-add" id="tab-add-btn" title="新建连接" data-i18n-title="common.new">＋</button>
          <div class="split-controls" id="split-controls" hidden></div>
          <div class="tab-actions" id="tab-actions">
            <button id="ai-status" class="icon-btn" title="AI 助手" data-i18n-title="common.ai" hidden></button>
          </div>
        </div>
        <div class="panes" id="panes"></div>
        <div class="empty-state" id="empty-state">
          <h1>pshell</h1>
          <p data-i18n="empty.title">跨平台 SSH 终端客户端。核心只做 SSH，其他功能都是可在设置中单独开关的模块。</p>
          <p class="muted" data-i18n="empty.hint">从左侧选择一个连接，或点击 ＋ 新建连接。</p>
        </div>
      </div>

      <!-- AI 助手（可开关；关闭时入口隐藏、命令被后端门控拒绝）。
           停靠在主区右侧，与终端并存；左缘可拖拽调宽。 -->
      <aside class="ai-panel" id="ai-panel" hidden>
        <div class="ai-panel-resizer" id="ai-resizer" title="拖动调整宽度"></div>
        <header class="ai-panel-head">
          <span class="ai-panel-title" data-i18n="modal.ai">AI 助手</span>
          <span class="spacer"></span>
          <button class="icon-btn" id="ai-clear-btn" title="清空当前对话">🧹</button>
          <button class="icon-btn" id="ai-close" title="关闭">✕</button>
        </header>
        <div class="ai-panel-session">
          <span class="ai-session-dot" id="ai-session-dot"></span>
          <span id="ai-hint"></span>
        </div>
        <!-- 中部：可滚动内容区，展示当前 SSH 会话的消息流（见 ai.js renderScroll） -->
        <div class="ai-panel-scroll" id="ai-body"></div>
        <!-- 底部：输入框 + 控件行（模式 / 模型 / 发送） -->
        <div class="ai-panel-compose">
          <div class="ai-composer">
            <textarea id="ai-input" rows="2" spellcheck="false"></textarea>
            <div class="ai-composer-bar">
              <div class="ai-mode-switch" id="ai-mode-switch"></div>
              <span class="ai-model-host" id="ai-model-host"></span>
              <button class="ai-send" id="ai-send" type="button" title="发送"></button>
            </div>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <!-- 连接编辑 -->
  <div class="modal-mask" id="modal-connection" hidden>
    <div class="modal">
      <header class="modal-head">
        <h2 id="conn-modal-title">新建连接</h2>
        <button class="icon-btn" data-close="modal-connection">✕</button>
      </header>
      <div class="modal-body" id="conn-form"></div>
      <footer class="modal-foot">
        <button class="btn danger" id="conn-delete" data-i18n="common.delete" hidden>删除</button>
        <span class="spacer"></span>
        <button class="btn ghost" id="conn-test" data-i18n="common.test">测试连接</button>
        <button class="btn ghost" data-close="modal-connection" data-i18n="common.cancel">取消</button>
        <button class="btn primary" id="conn-save" data-i18n="common.save">保存</button>
      </footer>
    </div>
  </div>

  <!-- 设置 -->
  <div class="modal-mask" id="modal-settings" hidden>
    <div class="modal wide">
      <header class="modal-head">
        <h2 data-i18n="modal.settings">设置</h2>
        <button class="icon-btn" data-close="modal-settings">✕</button>
      </header>
      <div class="settings-layout">
        <nav class="settings-nav" id="settings-nav"></nav>
        <div class="modal-body" id="settings-body"></div>
      </div>
      <footer class="modal-foot">
        <span class="muted" id="settings-hint"></span>
        <span class="spacer"></span>
        <button class="btn ghost" id="settings-reset" data-i18n="common.reset">恢复默认</button>
        <button class="btn ghost" data-close="modal-settings" data-i18n="common.cancel">取消</button>
        <button class="btn primary" id="settings-save" data-i18n="common.save">保存</button>
      </footer>
    </div>
  </div>

  <!-- Git 同步（可开关；关闭时入口隐藏、命令被后端门控拒绝） -->
  <div class="modal-mask" id="modal-git" hidden>
    <div class="modal wide">
      <header class="modal-head">
        <h2 data-i18n="modal.git">Git 同步</h2>
        <button class="icon-btn" data-close="modal-git">✕</button>
      </header>
      <div class="modal-body" id="git-body"></div>
      <footer class="modal-foot">
        <span class="muted" id="git-hint"></span>
        <span class="spacer"></span>
        <button class="btn ghost" data-close="modal-git" data-i18n="common.close">关闭</button>
      </footer>
    </div>
  </div>

  <!-- 会话日志（可开关；关闭时入口隐藏、命令被后端门控拒绝） -->
  <div class="modal-mask" id="modal-session-log" hidden>
    <div class="modal wide">
      <header class="modal-head">
        <h2 data-i18n="modal.sessionLog">会话日志</h2>
        <button class="icon-btn" data-close="modal-session-log">✕</button>
      </header>
      <div class="modal-body" id="log-body"></div>
      <footer class="modal-foot">
        <span class="muted" id="log-hint"></span>
        <span class="spacer"></span>
        <button class="btn ghost" data-close="modal-session-log" data-i18n="common.close">关闭</button>
      </footer>
    </div>
  </div>

  <!-- SFTP（可开关；关闭时入口隐藏、命令被后端门控拒绝） -->
  <div class="modal-mask" id="modal-sftp" hidden>
    <div class="modal wide">
      <header class="modal-head">
        <h2 data-i18n="modal.sftp">SFTP 文件</h2>
        <button class="icon-btn" data-close="modal-sftp">✕</button>
      </header>
      <div class="modal-body" id="sftp-body"></div>
      <footer class="modal-foot">
        <span class="muted" id="sftp-hint"></span>
        <span class="spacer"></span>
        <button class="btn ghost" data-close="modal-sftp" data-i18n="common.close">关闭</button>
      </footer>
    </div>
  </div>

  <!-- 端口转发（可开关；关闭时入口隐藏、命令被后端门控拒绝） -->
  <div class="modal-mask" id="modal-port-forward" hidden>
    <div class="modal wide">
      <header class="modal-head">
        <h2 data-i18n="modal.portForward">端口转发</h2>
        <button class="icon-btn" data-close="modal-port-forward">✕</button>
      </header>
      <div class="modal-body" id="pf-body"></div>
      <footer class="modal-foot">
        <span class="muted" id="pf-hint"></span>
        <span class="spacer"></span>
        <button class="btn ghost" data-close="modal-port-forward" data-i18n="common.close">关闭</button>
      </footer>
    </div>
  </div>

  <!-- 连接导入导出（可开关；关闭时入口隐藏、命令被后端门控拒绝） -->
  <div class="modal-mask" id="modal-import-export" hidden>
    <div class="modal wide">
      <header class="modal-head">
        <h2 data-i18n="modal.importExport">配置导入导出</h2>
        <button class="icon-btn" data-close="modal-import-export">✕</button>
      </header>
      <div class="modal-body" id="ie-body"></div>
      <footer class="modal-foot">
        <span class="muted" id="ie-hint"></span>
        <span class="spacer"></span>
        <button class="btn ghost" data-close="modal-import-export" data-i18n="common.close">关闭</button>
      </footer>
    </div>
  </div>

  <!-- 命令片段（可开关；关闭时入口隐藏、命令被后端门控拒绝） -->
  <div class="modal-mask" id="modal-snippets" hidden>
    <div class="modal wide">
      <header class="modal-head">
        <h2 data-i18n="modal.snippets">命令片段</h2>
        <button class="icon-btn" data-close="modal-snippets">✕</button>
      </header>
      <div class="modal-body" id="snip-body"></div>
      <footer class="modal-foot">
        <span class="muted" id="snip-hint"></span>
        <span class="spacer"></span>
        <button class="btn ghost" data-close="modal-snippets" data-i18n="common.close">关闭</button>
      </footer>
    </div>
  </div>

  <!-- 命令历史（可开关；关闭时入口隐藏、命令被后端门控拒绝） -->
  <div class="modal-mask" id="modal-history" hidden>
    <div class="modal wide">
      <header class="modal-head">
        <h2 data-i18n="modal.history">命令历史</h2>
        <button class="icon-btn" data-close="modal-history">✕</button>
      </header>
      <div class="modal-body" id="hist-body"></div>
      <footer class="modal-foot">
        <span class="muted" id="hist-hint"></span>
        <span class="spacer"></span>
        <button class="btn ghost" data-close="modal-history" data-i18n="common.close">关闭</button>
      </footer>
    </div>
  </div>

  <!-- 全局搜索（跨连接 / 片段 / 历史 / 设置；数据源均在打开面板时一次性拉齐） -->
  <div class="modal-mask" id="modal-search" hidden>
    <div class="modal wide">
      <header class="modal-head">
        <h2 data-i18n="modal.search">全局搜索</h2>
        <input
          class="search-input"
          id="search-input"
          type="text"
          spellcheck="false"
          placeholder="搜索连接 / 命令片段 / 命令历史 / 设置…"
        />
        <button class="icon-btn" data-close="modal-search">✕</button>
      </header>
      <div class="modal-body" id="search-body"></div>
      <footer class="modal-foot">
        <span class="muted" id="search-hint"></span>
        <span class="muted" id="search-tip">空格分隔的多个关键词需同时命中。</span>
        <span class="spacer"></span>
        <button class="btn ghost" data-close="modal-search" data-i18n="common.close">关闭</button>
      </footer>
    </div>
  </div>

  <!-- 快捷命令面板（类 Spotlight；列出快捷键动作，由 app.quick_panel 唤起） -->
  <div class="modal-mask" id="modal-quick-panel" hidden>
    <div class="modal narrow">
      <header class="modal-head">
        <h2 data-i18n="modal.quickPanel">快捷面板</h2>
        <button class="icon-btn" data-close="modal-quick-panel">✕</button>
      </header>
      <div class="modal-body" id="quick-panel-body"></div>
      <footer class="modal-foot">
        <span class="muted" id="quick-panel-hint"></span>
        <span class="spacer"></span>
        <button class="btn ghost" data-close="modal-quick-panel" data-i18n="common.close">关闭</button>
      </footer>
    </div>
  </div>

  <!-- 分屏目标选择（分屏本身由 tabs.js 布局，这里只挑一个会话并进当前标签） -->
  <div class="modal-mask" id="modal-split" hidden>
    <div class="modal narrow">
      <header class="modal-head">
        <h2 id="split-title">分屏</h2>
        <button class="icon-btn" data-close="modal-split">✕</button>
      </header>
      <div class="modal-body" id="split-body"></div>
      <footer class="modal-foot">
        <span class="muted" id="split-hint"></span>
        <span class="spacer"></span>
        <button class="btn ghost" data-close="modal-split" data-i18n="common.cancel">取消</button>
      </footer>
    </div>
  </div>

  <!-- 危险命令二次确认 -->
  <div class="modal-mask" id="modal-danger" hidden>
    <div class="modal narrow">
      <header class="modal-head warn">
        <h2 data-i18n="modal.danger">危险命令确认</h2>
      </header>
      <div class="modal-body">
        <p data-i18n="danger.desc">即将在远端执行以下命令，其影响不可撤销：</p>
        <pre class="danger-cmd" id="danger-cmd"></pre>
        <p class="danger-reason" id="danger-reason"></p>
      </div>
      <footer class="modal-foot">
        <span class="spacer"></span>
        <button class="btn ghost" id="danger-cancel" data-i18n="common.cancel">取消</button>
        <button class="btn danger" id="danger-confirm" data-i18n="common.confirm">确认执行</button>
      </footer>
    </div>
  </div>

  <div class="toast-host" id="toast-host"></div>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/xterm-addon-fit.js"></script>
  <script src="js/util.js"></script>
  <script src="js/context_menu.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/ipc.js"></script>
  <script src="js/danger.js"></script>
  <script src="js/ssh.js"></script>
  <script src="js/terminal.js"></script>
  <script src="js/tabs.js"></script>
  <script src="js/split.js"></script>
  <script src="js/connections.js"></script>
  <script src="js/git_sync.js"></script>
  <script src="js/session_log.js"></script>
  <script src="js/sftp.js"></script>
  <script src="js/port_forward.js"></script>
  <script src="js/import_export.js"></script>
  <script src="js/snippets.js"></script>
  <script src="js/history.js"></script>
  <script src="js/search.js"></script>
  <script src="js/quick_panel.js"></script>
  <script src="js/shortcuts.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
